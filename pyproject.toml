[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filecrypt"
version = "0.1.0"
description = "Encrypt files to the .fcx format (AES-256-GCM STREAM, Argon2id/scrypt/HKDF)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# Only needed when the installed cryptography has no native Argon2id (< 44 or old OpenSSL).
argon2 = ["argon2-cffi>=21.1"]
keyring = ["keyring>=24"]
test = ["pytest>=7"]

[project.scripts]
filecrypt = "filecrypt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
