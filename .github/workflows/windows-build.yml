name: Windows build

# Builds the portable (onedir) Windows app with PyInstaller, runs the frozen
# self-test against it, and uploads the folder as a zip. It also wraps the
# folder in a per-user Inno Setup installer (packaging/filecrypt.iss) and
# checks that it installs, registers with Explorer and uninstalls cleanly.
# Both are unsigned test builds. On branches and PRs they stay CI artifacts.
# Pushing a tag vX.Y.Z also publishes them as a GitHub pre-release with a
# SHA256SUMS.txt, and every non-PR build gets a build provenance attestation,
# so a download can be checked against GitHub's record of this workflow:
#
#   gh attestation verify <file> --repo Zarkion/filecrypt
#
# Code signing needs a certificate, which the project doesn't have yet.

on:
  push:
    branches: [main]
    tags: ["v*"]  # path filters don't apply to tag pushes
    paths:
      - "src/**"
      - "packaging/**"
      - "tests/vectors/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "tests/vectors/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: portable build (windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write      # OIDC for the provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.zip.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install build dependencies (hash-pinned)
        run: python -m pip install --require-hashes --only-binary=":all:" -r packaging/requirements-build.txt
      - name: Install filecrypt
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Check Argon2 backend
        run: python .github/scripts/check_ci_env.py backend native
      - name: Build
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/filecrypt.spec
      - name: Frozen self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -I packaging/selftest.py dist --dist dist/filecrypt --vectors tests/vectors
      - name: Zip
        id: zip
        shell: pwsh
        run: |
          Remove-Item dist/filecrypt/filecrypt-selftest.exe
          $version = (python -c "import filecrypt; print(filecrypt.__version__)").Trim()
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "filecrypt-$version-windows-x64-unsigned-$sha"
          Compress-Archive -Path dist/filecrypt -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Tee-Object "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Build installer (unsigned, per user)
        id: setup
        shell: pwsh
        run: |
          # Pinned, so the runner image's copy can't change the installer under us.
          $innoVersion = "6.7.1"
          choco install innosetup --version $innoVersion --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # ISCC.exe's own version resource reads 0.0.0.0, so ask choco.
          $have = (choco list innosetup --exact --limit-output) -replace '^innosetup\|', ''
          if ($have -ne $innoVersion) { throw "Inno Setup is '$have', expected $innoVersion" }
          $name = "filecrypt-${{ steps.zip.outputs.version }}-windows-x64-unsigned-${{ steps.zip.outputs.sha }}-setup"
          & $iscc /Qp "/DAppVersion=${{ steps.zip.outputs.version }}" "/DOutputName=$name" packaging/filecrypt.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist-installer/$name.exe" .
          (Get-FileHash "$name.exe" -Algorithm SHA256).Hash.ToLower() + "  $name.exe" | Tee-Object "$name.exe.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Installer smoke test (install, register, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:LOCALAPPDATA "Programs\filecrypt"
          $key = "HKCU:\Software\Classes\filecrypt.fcx\shell\decrypt\command"
          $p = Start-Process "./${{ steps.setup.outputs.name }}.exe" -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=setup.log"
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup exited $($p.ExitCode)" }
          foreach ($f in "filecrypt-gui.exe", "filecrypt.exe", "unins000.exe") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "missing $f in $app" }
          }
          if (Test-Path (Join-Path $app "filecrypt-selftest.exe")) { throw "self-test exe was installed" }
          $cmd = (Get-ItemProperty $key)."(default)"
          $want = '"' + (Join-Path $app "filecrypt-gui.exe") + '" --decrypt -- "%1"'
          if ($cmd -ne $want) { throw "registered '$cmd', expected '$want'" }
          & (Join-Path $app "filecrypt.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "installed filecrypt.exe failed" }

          $p = Start-Process (Join-Path $app "unins000.exe") -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($p.ExitCode -ne 0) { throw "uninstall exited $($p.ExitCode)" }
          # The uninstaller hands off to a copy of itself in %TEMP%; wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $app "filecrypt-gui.exe")); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $app "filecrypt-gui.exe")) { throw "uninstall left the app behind" }
          foreach ($k in "HKCU:\Software\Classes\filecrypt.fcx",
                         "HKCU:\Software\Classes\*\shell\filecrypt.encrypt") {
            if (Test-Path -LiteralPath $k) { throw "uninstall left $k" }
          }
          "install, register, unregister and uninstall all worked"
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            ${{ steps.zip.outputs.name }}.zip
            ${{ steps.setup.outputs.name }}.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            ${{ steps.zip.outputs.name }}.zip
            ${{ steps.zip.outputs.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.setup.outputs.name }}
          path: |
            ${{ steps.setup.outputs.name }}.exe
            ${{ steps.setup.outputs.name }}.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish pre-release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: filecrypt-*
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the package version $VERSION"
            exit 1
          fi
          cd assets
          cat *.sha256 > SHA256SUMS.txt
          rm *.sha256
          sha256sum --check --strict SHA256SUMS.txt
          cat > notes.md <<EOF
          Unsigned test build of filecrypt $VERSION for 64-bit Windows 10 and later.

          - \`*-setup.exe\`: per-user installer, no administrator rights needed. Windows SmartScreen will warn that the publisher is unknown, because it isn't code-signed yet.
          - \`*.zip\`: the same app as a portable folder.

          Check a download before you run it. The hash should match \`SHA256SUMS.txt\`:

              (Get-FileHash .\\<file>).Hash

          The build provenance attestation ties the file to the workflow run that built it, independently of this page (needs the GitHub CLI):

              gh attestation verify <file> --repo $GITHUB_REPOSITORY
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "filecrypt $VERSION (unsigned test build)" --notes-file notes.md \
            *.exe *.zip SHA256SUMS.txt
