name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Every OS / CPU / Python combination, with the default install: the newest
  # cryptography, whose built-in Argon2id is the primary backend.
  test:
    name: ${{ matrix.os }} py${{ matrix.python }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64: every supported Python
          - { os: ubuntu-24.04, arch: x64, python: "3.9" }  # ubuntu-latest (26.04) has no 3.9 build
          - { os: ubuntu-latest, arch: x64, python: "3.10" }
          - { os: ubuntu-latest, arch: x64, python: "3.11" }
          - { os: ubuntu-latest, arch: x64, python: "3.12" }
          - { os: ubuntu-latest, arch: x64, python: "3.13" }
          - { os: ubuntu-latest, arch: x64, python: "3.14" }
          # Linux arm64
          - { os: ubuntu-24.04-arm, arch: arm64, python: "3.9" }
          - { os: ubuntu-24.04-arm, arch: arm64, python: "3.14" }
          # Windows x64, 32-bit x86 and arm64
          - { os: windows-latest, arch: x64, python: "3.9" }
          - { os: windows-latest, arch: x64, python: "3.14" }
          - { os: windows-latest, arch: x86, python: "3.9" }
          - { os: windows-latest, arch: x86, python: "3.14" }
          - { os: windows-11-arm, arch: arm64, python: "3.14" }
          # macOS arm64 and Intel
          - { os: macos-latest, arch: arm64, python: "3.10" }
          - { os: macos-latest, arch: arm64, python: "3.14" }
          - { os: macos-15-intel, arch: x64, python: "3.14" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install
        # cryptography 50 ships no wheel for 32-bit or arm64 Windows, and
        # building it needs Rust and OpenSSL. Take the newest release that has
        # a wheel for this platform; the backend check prints which one.
        run: python -m pip install --only-binary=cryptography -e ".[test]" -e plugins/filecrypt-azkv
      - name: Check Argon2 backend
        run: python .github/scripts/check_ci_env.py backend native
      - name: Test
        run: python -m pytest -rs --junitxml=junit.xml tests plugins/filecrypt-azkv/tests
      - name: Check platform-only tests ran
        run: python .github/scripts/check_ci_env.py skips junit.xml

  # Each Argon2 backend filecrypt can end up on, on the three main platforms.
  backends:
    name: ${{ matrix.backend }} backend, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend: [cffi, scrypt]
        include:
          # argon2-cffi next to the built-in Argon2id: cross-checks the two.
          - { os: ubuntu-latest, backend: native+cffi, packages: "argon2-cffi" }
          # cryptography 41 has no built-in Argon2id.
          - { backend: cffi, packages: "cryptography==41.0.7 argon2-cffi" }
          - { backend: scrypt, packages: "cryptography==41.0.7" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install
        run: python -m pip install -e ".[test]" -e plugins/filecrypt-azkv ${{ matrix.packages }}
      - name: Check Argon2 backend
        run: python .github/scripts/check_ci_env.py backend ${{ matrix.backend }}
      - name: Test
        shell: bash
        run: |
          deselect=()
          if [ "${{ matrix.backend }}" = scrypt ]; then
            # These tests assume Argon2id is installed (they expect it as the
            # default KDF). Everything else, including full encrypt/decrypt
            # round trips, runs on the scrypt fallback.
            for t in \
              tests/test_cli.py::test_round_trip_env_passphrase \
              tests/test_cli.py::test_default_argon_settings \
              tests/test_cli.py::test_short_keyfile_rejected_unless_flag \
              tests/test_cli.py::test_rekey_argon_settings \
              tests/test_cli.py::test_heavy_file_refused_when_not_interactive \
              tests/test_cli.py::test_heavy_file_allowed_with_explicit_limit \
              tests/test_cli.py::test_heavy_file_interactive_confirm \
              tests/test_kdf.py::test_argon2_derive_deterministic_and_salted \
              tests/test_kdf.py::test_select_passphrase_defaults_to_argon2id \
              tests/test_kdf.py::test_select_custom_argon \
              tests/test_kdf.py::test_select_rejects_argon_below_floor \
              tests/test_kdf.py::test_select_short_key_rejected_unless_passphrase_mode \
              tests/test_kdf.py::test_keyfile_is_passphrase_forces_passphrase_kdf_even_for_long_keys \
              tests/test_keyring_source.py::test_example_passphrase_in_keyring_goes_through_argon2 \
              tests/test_engine.py::test_inspect_file \
              tests/test_engine.py::test_short_key_rejected_unless_passphrase_mode \
              tests/test_engine.py::test_expensive_refused_without_confirm \
              tests/test_engine.py::test_expensive_accepted \
              tests/test_engine.py::test_expensive_within_explicit_limit
            do deselect+=(--deselect "$t"); done
          fi
          python -m pytest -rs --junitxml=junit.xml "${deselect[@]}" tests plugins/filecrypt-azkv/tests
      - name: Check platform-only tests ran
        run: python .github/scripts/check_ci_env.py skips junit.xml
