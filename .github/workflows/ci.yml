name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Every OS / CPU / Python combination, with the default install: the newest
  # cryptography, whose built-in Argon2id is the primary backend.
  test:
    name: ${{ matrix.os }} py${{ matrix.python }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64: every supported Python
          - { os: ubuntu-24.04, arch: x64, python: "3.9" }  # ubuntu-latest (26.04) has no 3.9 build
          - { os: ubuntu-latest, arch: x64, python: "3.10" }
          - { os: ubuntu-latest, arch: x64, python: "3.11" }
          - { os: ubuntu-latest, arch: x64, python: "3.12" }
          - { os: ubuntu-latest, arch: x64, python: "3.13" }
          - { os: ubuntu-latest, arch: x64, python: "3.14" }
          # Linux arm64
          - { os: ubuntu-24.04-arm, arch: arm64, python: "3.9" }
          - { os: ubuntu-24.04-arm, arch: arm64, python: "3.14" }
          # Windows x64, 32-bit x86 and arm64
          - { os: windows-latest, arch: x64, python: "3.9" }
          - { os: windows-latest, arch: x64, python: "3.14" }
          - { os: windows-latest, arch: x86, python: "3.9" }
          - { os: windows-latest, arch: x86, python: "3.14" }
          - { os: windows-11-arm, arch: arm64, python: "3.14" }
          # macOS arm64 and Intel
          - { os: macos-latest, arch: arm64, python: "3.10" }
          - { os: macos-latest, arch: arm64, python: "3.14" }
          - { os: macos-15-intel, arch: x64, python: "3.14" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install
        # cryptography 50 ships no wheel for 32-bit or arm64 Windows, and
        # building it needs Rust and OpenSSL. Take the newest release that has
        # a wheel for this platform; the backend check prints which one.
        run: python -m pip install --only-binary=cryptography -e ".[test]" -e plugins/filecrypt-azkv
      - name: Check Argon2 backend
        run: python .github/scripts/check_ci_env.py backend native
      - name: Test
        run: python -m pytest -rs --junitxml=junit.xml tests plugins/filecrypt-azkv/tests
      - name: Check platform-only tests ran
        run: python .github/scripts/check_ci_env.py skips junit.xml

  # Each Argon2 backend filecrypt can end up on, on the three main platforms.
  backends:
    name: ${{ matrix.backend }} backend, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend: [cffi, scrypt]
        include:
          # argon2-cffi next to the built-in Argon2id: cross-checks the two.
          - { os: ubuntu-latest, backend: native+cffi, packages: "argon2-cffi" }
          # cryptography 41 has no built-in Argon2id.
          - { backend: cffi, packages: "cryptography==41.0.7 argon2-cffi" }
          - { backend: scrypt, packages: "cryptography==41.0.7" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install
        run: python -m pip install -e ".[test]" -e plugins/filecrypt-azkv ${{ matrix.packages }}
      - name: Check Argon2 backend
        run: python .github/scripts/check_ci_env.py backend ${{ matrix.backend }}
      - name: Test
        # On the scrypt backend, tests marked requires_argon2 skip themselves
        # (tests/conftest.py). Everything else, including full encrypt/decrypt
        # round trips, runs on the scrypt fallback.
        run: python -m pytest -rs --junitxml=junit.xml tests plugins/filecrypt-azkv/tests
      - name: Check platform-only tests ran
        run: python .github/scripts/check_ci_env.py skips junit.xml

  # The desktop window (filecrypt[gui]), driven offscreen with pytest-qt.
  # PySide6 has no 32-bit Windows wheels, so the window isn't offered there.
  gui:
    name: GUI ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    env:
      QT_QPA_PLATFORM: offscreen
      FILECRYPT_REQUIRE_GUI_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[test-gui]"
      - name: Test
        run: python -m pytest -rs tests/gui
      - name: Start the window
        # The entry point must import and build the window without a display.
        run: python -c "from filecrypt.gui.window import MainWindow; from PySide6.QtWidgets import QApplication; app = QApplication([]); w = MainWindow(); w.show(); app.processEvents(); print('window ok')"
