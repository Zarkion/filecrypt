name: Release

# Pushing a tag vX.Y.Z builds the sdist and wheel and checks them. Publishing
# to PyPI (with GitHub artifact attestations) runs only when the repository
# variable PYPI_PUBLISH is set to "true", which it is not by default. Until
# then a tag only builds; nothing leaves GitHub except the run's artifacts.
#
# To enable publishing:
#   1. On pypi.org, add a Trusted Publisher (a "pending publisher" before the
#      first upload) for project "filecrypt": owner Zarkion, repository
#      filecrypt, workflow release.yml, environment pypi.
#   2. In this repository's Settings > Environments, create "pypi" (adding
#      required reviewers and a v* tag rule is recommended).
#   3. In Settings > Secrets and variables > Actions > Variables, add
#      PYPI_PUBLISH = true.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # build-only dry run from any branch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build==1.6.1 twine==7.0.0

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ ! -f "dist/filecrypt-${version}.tar.gz" ]; then
            echo "::error::Tag $TAG does not match the package version. Built:"
            ls dist
            exit 1
          fi

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/filecrypt --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Off unless the repository variable PYPI_PUBLISH is "true", and only for tags.
    if: >-
      vars.PYPI_PUBLISH == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/filecrypt/
    permissions:
      contents: read
      id-token: write      # OIDC for Trusted Publishing and attestations
      attestations: write  # GitHub artifact attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-path: dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
