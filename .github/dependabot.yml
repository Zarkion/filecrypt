# Keeps the GitHub Actions used by CI (checkout, setup-python, ...) current.
# Python dependencies are deliberately not tracked here.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
