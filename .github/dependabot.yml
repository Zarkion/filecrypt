# Keeps the GitHub Actions used by CI (checkout, setup-python, ...) current,
# and the Python packages bundled into the Windows build (cryptography's
# OpenSSL, PySide6's Qt, PyInstaller), which are hash-pinned in
# packaging/requirements-build.txt.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "pip"
    directory: "/packaging"
    schedule:
      interval: "weekly"
    groups:
      windows-build:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
