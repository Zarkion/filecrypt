[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filecrypt-azkv"
version = "0.1.0"
description = "Azure Key Vault key source for filecrypt (--key azkv:VAULT/SECRET)"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "filecrypt>=0.1",
    "azure-identity>=1.15",
    "azure-keyvault-secrets>=4.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

# This is the whole plugin contract: one entry point in filecrypt's group.
[project.entry-points."filecrypt.key_sources"]
azkv = "filecrypt_azkv:AzureKeyVaultSource"

[tool.setuptools]
py-modules = ["filecrypt_azkv"]
package-dir = { "" = "src" }
